spring.application.name=ProMantenimiento
server.port=${SERVER_PORT:8086}
server.servlet.context-path=/promantenimiento
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/bdpromantenimiento_pms276_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms276}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
firebase.project-id=${FIREBASE_PROJECT_ID:demo-pms276}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.auth.emulator-host=${FIREBASE_AUTH_EMULATOR_HOST:}
app.upload.dir=${APP_UPLOAD_DIR:uploads/incidencias}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=65MB
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
