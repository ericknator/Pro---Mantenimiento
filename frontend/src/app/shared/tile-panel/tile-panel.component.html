<section class="panel">
  <header class="panel__head">
    <h2 class="label">{{ title() }}</h2>
    @if (subtitle()) {
      <span class="meta">{{ subtitle() }}</span>
    }
  </header>
  <div class="grid">
    @for (item of items(); track item.route) {
      <a class="tile" [routerLink]="item.route">
        <span class="tile__icon"><span class="material-symbols-rounded">{{ item.icon }}</span></span>
        <span class="tile__label">{{ item.label }}</span>
      </a>
    }
  </div>
</section>
