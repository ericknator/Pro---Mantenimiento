spring.application.name=ProMantenimiento
server.port=${PORT:8086}
server.servlet.context-path=/promantenimiento
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/bdpromantenimiento20262}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
firebase.project-id=${FIREBASE_PROJECT_ID:bdpromantenimiento20262}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.auth.emulator-host=${FIREBASE_AUTH_EMULATOR_HOST:}
app.upload.dir=${APP_UPLOAD_DIR:uploads/incidencias}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=65MB
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
